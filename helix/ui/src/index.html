<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELIX — Command Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<!--
  HELIX Command Deck — single-file UI (Voice Core + Agent Town + World Monitor).
  Integration guide: see the "BRIDGE PROTOCOL" comment at the top of the main script (00_core.js section). Everything is original code:
  procedural pixel-art, procedural Earth, Three.js particle orb. No external assets are required.
-->
<div id="boot"><div class="boot-in"><div class="boot-logo">HELIX</div><div class="boot-lines" id="boot-lines"></div><div class="boot-bar"><i id="boot-bar"></i></div></div></div>

<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <div class="logo"><svg viewBox="0 0 32 32" width="22" height="22"><path d="M5 4c0 8 6 8 11 12S27 24 27 28M27 4c0 8-6 8-11 12S5 24 5 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M8 9h16M8 23h16" stroke="currentColor" stroke-width="1.4" opacity=".55"/></svg><b>HELIX</b></div>
      <button class="chip-btn" id="tb-demo" title="Connection status — open settings"><i class="dot"></i><span id="tb-bridge">BRIDGE OFFLINE</span></button>
      <button class="chip-btn" id="tb-lms" title="University LMS operations"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M3 9l9-5 9 5-9 5-9-5zm4 3v4c0 1.5 2.5 3 5 3s5-1.5 5-3v-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>LMS<span class="badge" id="tb-lms-badge" hidden>0</span></button>
    </div>
    <div class="tb-right">
      <span class="tb-stat" id="tb-clock">--:--</span>
      <button class="chip-btn danger" id="tb-kill" title="Halt the UI (voice + display); running Hermes tasks are not cancelled"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3v9M6.3 6.8a8 8 0 1011.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>HALT</button>
      <span class="tb-ver">v0.1 · ui-preview</span>
      <button class="icon-btn" id="tb-full" title="Fullscreen"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    </div>
  </header>

  <main id="grid">
    <!-- ================= LEFT: MEDIA + WORLD MONITOR ================= -->
    <section id="col-left">
      <div class="panel" id="media-panel">
        <h3 class="ptitle"><i class="pdot"></i>MEDIA LINK<span class="spacer"></span><button class="icon-btn sm" id="btn-media-more" title="Preview info">···</button></h3>
        <div class="media-screen" id="media-screen">
          <video id="media-video" autoplay muted playsinline hidden></video>
          <div class="media-off" id="media-off">SYSTEM OFFLINE</div>
          <canvas id="media-fx"></canvas>
          <div class="media-tag" id="media-tag" hidden>LOCAL PREVIEW</div>
          <div class="media-btns">
            <button class="icon-btn" id="btn-cam" title="Camera"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 8h3l2-2h6l2 2h3v11H4z M12 16.5a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
            <button class="icon-btn" id="btn-screen" title="Share screen"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 5h18v11H3zM8 20h8M12 16v4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
          </div>
        </div>
      </div>

      <div class="ptitle-row"><i class="pdot"></i>SAT-LINK FEED<span class="spacer"></span><span class="mini-stat" id="sat-status">INIT</span></div>
      <div class="panel" id="sat-panel">
        <div class="sat-head"><i class="pdot sm"></i><span>SATELLITE STREAM</span><span class="spacer"></span><button class="icon-btn sm" id="btn-sat-expand" title="Expand world monitor"><svg viewBox="0 0 24 24" width="12" height="12"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>
        <div id="sat-body">
          <div id="globe-wrap">
            <canvas id="globe-canvas"></canvas>
            <canvas id="map2d"></canvas>
            <div id="globe-top">
              <button class="mini-btn" id="btn-hide-map">▾ Hide Map</button>
              <div class="seg"><button id="btn-2d">2D</button><button id="btn-3d" class="on">3D</button></div>
              <button class="mini-btn ghost" id="btn-sat-full" title="Fullscreen">⤢</button>
            </div>
            <div id="globe-zoom"><button id="gz-in">+</button><button id="gz-out">−</button><button id="gz-home" title="Reset view">⌂</button><button id="gz-spin" title="Auto-rotate" class="on">⟳</button></div>
            <div id="globe-badge">LIVE</div>
            <div id="globe-tip" hidden></div>
            <div id="globe-info" hidden></div>
            <div id="globe-layers"></div>
            <div id="globe-clock"></div>
          </div>
          <div id="sat-views">
            <div class="sat-view" id="sv-search" hidden>
              <input id="sat-q" type="text" placeholder="Search city, country, callsign, quake…" autocomplete="off">
              <div id="sat-results"></div>
            </div>
            <div class="sat-view" id="sv-alerts" hidden><div id="sat-alert-list"></div></div>
            <div class="sat-view" id="sv-more" hidden><div id="sat-more-list"></div></div>
          </div>
        </div>
        <nav id="sat-nav">
          <button data-v="today" class="on"><svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Today</span></button>
          <button data-v="map"><svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Map</span></button>
          <button data-v="search"><svg viewBox="0 0 24 24" width="15" height="15"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8"/></svg><span>Search</span></button>
          <button data-v="alerts"><svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 4l9 16H3z M12 10v4 M12 17v.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span>Alerts</span><i class="nav-badge" id="alerts-badge" hidden>0</i></button>
          <button data-v="more"><svg viewBox="0 0 24 24" width="15" height="15"><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/></svg><span>More</span></button>
        </nav>
      </div>

      <div class="panel grow" id="news-panel">
        <h3 class="ptitle"><i class="pdot"></i>TODAY HEADLINES<span class="spacer"></span><span class="mini-stat" id="news-src">—</span><button class="icon-btn sm" id="btn-news-refresh" title="Refresh">⟳</button></h3>
        <ol id="headlines"></ol>
      </div>
    </section>

    <!-- ================= CENTER: VOICE CORE + AGENT TOWN ================= -->
    <section id="col-center">
      <div id="voicecore">
        <div id="nodes">
          <button class="node n-memory" data-node="memory"><span class="ni"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 4a4 4 0 00-4 4 3.5 3.5 0 00-1 6 3.5 3.5 0 004 4h1V4zm6 0a4 4 0 014 4 3.5 3.5 0 011 6 3.5 3.5 0 01-4 4h-1V4z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="nl">MEMORY</span><i class="nb" id="nb-memory">0</i></button>
          <button class="node n-skills" data-node="skills"><span class="ni"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 5c3-1.5 5-1.5 8 0 3-1.5 5-1.5 8 0v14c-3-1.5-5-1.5-8 0-3-1.5-5-1.5-8 0zM12 5v14" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="nl">SKILLS</span><i class="nb" id="nb-skills">0</i></button>
          <button class="node n-soul" data-node="soul"><span class="ni"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3c4 4 6 7 6 10a6 6 0 01-12 0c0-3 2-6 6-10z M12 21v-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="nl">SOUL</span><i class="nb" id="nb-soul">0</i></button>
          <button class="node n-setting" data-node="setting"><span class="ni"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="nl">SETTING</span></button>
        </div>
        <canvas id="wires"></canvas>
        <div class="panel orb-panel" id="orb-panel">
          <div class="think-chip" id="think-chip"><svg viewBox="0 0 24 24" width="11" height="11"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="think-label">IDLE</span><b class="toggle" id="think-toggle" title="Show reasoning stream"><i></i></b></div>
          <canvas id="orb-canvas"></canvas>
          <div id="orb-thoughts"></div>
          <div id="orb-caption"></div>
          <button class="start-btn" id="btn-start"><span id="btn-start-label">START AI</span></button>
        </div>
        <div id="drawer" hidden></div>
      </div>

      <div class="panel" id="town">
        <h3 class="ptitle"><i class="pdot"></i>AGENT TOWN<span class="state-pill" id="town-ready">READY</span><span class="spacer"></span>
          <div class="tabs" id="town-tabs"><button data-t="agents" class="on">agents</button><button data-t="hub">visual hub</button><button data-t="gesture">gesture</button></div>
          <span class="spacer"></span><button class="icon-btn sm" id="btn-town-fit" title="Re-center / fit">⟳</button></h3>
        <div id="town-body">
          <div class="tview on" id="view-agents">
            <canvas id="town-canvas"></canvas>
            <div id="town-roster"></div>
            <div id="town-prompt" hidden></div>
            <div id="town-card" hidden></div>
            <div id="town-tools"><button class="tool" id="tt-share" title="Event log / export"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="6" cy="12" r="2.3" fill="currentColor"/><circle cx="18" cy="6" r="2.3" fill="currentColor"/><circle cx="18" cy="18" r="2.3" fill="currentColor"/><path d="M8 11l8-4M8 13l8 4" stroke="currentColor" stroke-width="1.4"/></svg></button><button class="tool" id="tt-board" title="Open kanban"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 6h14M5 12h14M5 18h14" stroke="currentColor" stroke-width="2"/></svg></button><button class="tool" id="tt-me" title="Follow me / free camera"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="8" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1-5 13-5 14 0" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
            <div id="town-status">
              <span class="st-pill" id="st-online"><i class="dot"></i><span>Offline</span></span>
              <span class="st-pill" id="st-model"><svg viewBox="0 0 24 24" width="11" height="11"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg><span>No model yet</span></span>
              <span class="st-pill" id="st-ctx">CTX <i class="ctxbar"><b id="ctx-fill"></b></i><em id="ctx-txt">—</em></span>
              <span class="st-pill" id="st-seat"><svg viewBox="0 0 24 24" width="11" height="11"><circle cx="9" cy="8" r="3" fill="currentColor"/><circle cx="17" cy="9" r="2.4" fill="currentColor" opacity=".7"/><path d="M3 20c.5-5 11-5 12 0" fill="currentColor"/></svg><span id="seat-txt">0/0 seat</span></span>
              <span class="st-pill" id="st-busy"><svg viewBox="0 0 24 24" width="11" height="11"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg><span id="busy-txt">0/0 busy</span></span>
              <span class="spacer"></span>
              <button class="chat-fab" id="btn-chat-fab"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 6h18v12H3zM3 7l9 7 9-7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>CHAT</span></button>
            </div>
          </div>
          <div class="tview" id="view-hub"></div>
          <div class="tview" id="view-gesture"></div>
        </div>
      </div>
    </section>

    <!-- ================= RIGHT: VOICE / AGENT / NOTES ================= -->
    <section id="col-right">
      <div class="panel" id="side-panel">
        <div class="side-tabs">
          <div class="tabs big" id="side-tabs"><button data-p="voice" class="on">VOICE</button><button data-p="agent">AGENT</button><button data-p="notes">NOTES</button></div>
          <span class="spacer"></span>
          <button class="icon-btn" id="sd-new" title="New session"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2"/></svg></button>
          <button class="icon-btn" id="sd-history" title="Session history"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 12a8 8 0 108-8 8 8 0 00-6 2.7M4 4v4h4M12 8v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
          <button class="icon-btn" id="sd-term" title="Raw bridge events"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 6l6 6-6 6M12 19h8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
          <button class="icon-btn" id="sd-full" title="Focus mode"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        </div>
        <div class="side-body">
          <div class="spane on" id="pane-voice"><div class="feed" id="chat-feed"></div></div>
          <div class="spane" id="pane-agent"><div class="feed" id="tool-feed"></div><button id="new-msgs" hidden>⌄ New messages</button></div>
          <div class="spane" id="pane-notes"></div>
          <div class="spane" id="pane-term"><pre id="term-log"></pre></div>
          <div class="spane" id="pane-hist"></div>
        </div>
        <div class="composer">
          <div id="slash-menu" hidden></div>
          <div class="inputbar">
            <input id="cmd-input" type="text" placeholder="Type instruction or / command for HELIX..." autocomplete="off" spellcheck="false">
            <button class="icon-btn" id="btn-mic" title="Dictate (en/ur)"><svg viewBox="0 0 24 24" width="16" height="16"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0014 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
            <button class="icon-btn" id="btn-attach" title="File upload is not wired yet — use the document agent"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 11l-8 8a5 5 0 01-7-7l9-9a3.3 3.3 0 014.7 4.7l-9 9a1.7 1.7 0 01-2.4-2.4L16 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
            <button class="send-btn" id="btn-send" title="Send"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>
<div id="tip-global" hidden></div>

<script>/*__VENDOR__*/</script>
<script>/*__DATA__*/</script>
<script>
/*__JS__*/
</script>
</body>
</html>
